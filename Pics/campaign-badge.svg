<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 150" width="100%" height="100%">
  <defs>
    <!-- Dark tactile gradient -->
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>

    <!-- Subtle edge glow for status dot -->
    <filter id="cokeRedGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .badge-sub {
      font-family: 'Space Mono', 'SF Mono', 'Courier New', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.28em;
      fill: #8E8E93;
    }
    .badge-title {
      font-family: 'Space Grotesk', 'Syne', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 34px;
      font-weight: 900;
      font-style: italic;
      letter-spacing: -0.02em;
      text-transform: uppercase;
    }
    .pill-label {
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.14em;
      fill: #FFFFFF;
      text-transform: uppercase;
    }
  </style>

  <!-- Container Box with Rounded Edges -->
  <rect x="2" y="2" width="516" height="146" rx="18" fill="url(#badgeBg)" stroke="#27272A" stroke-width="1.5"/>

  <!-- Top-Right Red Tactical Accent Border -->
  <path d="M 470 2 L 500 2 A 18 18 0 0 1 518 20 L 518 50" fill="none" stroke="#F40009" stroke-width="3" stroke-linecap="round"/>

  <!-- Top Row: Status Dot & Product Specification -->
  <g transform="translate(32, 34)">
    <circle cx="0" cy="-4" r="3.5" fill="#F40009" filter="url(#cokeRedGlow)"/>
    <circle cx="0" cy="-4" r="3" fill="#F40009"/>
    <text x="14" y="0" class="badge-sub">COCA-COLA ORIGINAL TASTE</text>
  </g>

  <!-- Main Campaign Slogan: CHASE THE ORIGINAL -->
  <g transform="translate(32, 82)">
    <text class="badge-title">
      <tspan fill="#FFFFFF">CHASE </tspan>
      <tspan fill="#FFFFFF">THE </tspan>
      <tspan fill="#F40009">ORIGINAL</tspan>
    </text>
  </g>

  <!-- Bottom Row: Limited Drop Pill & Campaign Partner -->
  <g transform="translate(32, 122)">
    <!-- Red Pill Tag -->
    <rect x="0" y="-14" width="130" height="22" rx="6" fill="#F40009"/>
    <text x="65" y="1" text-anchor="middle" class="pill-label">LIMITED DROP</text>

    <!-- Sub indicator -->
    <text x="144" y="0" class="badge-sub" fill="#71717A">× Κ. ΑΡΓΥΡΟΣ // 2026</text>
  </g>

  <!-- Modern Tactical Crosshair (Bottom Right) -->
  <g stroke="#3F3F46" stroke-width="1.2" stroke-linecap="round">
    <line x1="480" y1="120" x2="492" y2="120"/>
    <line x1="486" y1="114" x2="486" y2="126"/>
  </g>
</svg>
