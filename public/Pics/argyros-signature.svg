<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 140" width="100%" height="100%">
  <!-- Transparent Background with subtle tactile glow -->
  <defs>
    <filter id="sigGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" filter="url(#sigGlow)">
    <!-- Initial stroke & loop -->
    <path d="M 45 110 C 50 80, 60 40, 70 20 C 72 16, 65 28, 60 55 C 58 72, 55 95, 58 115" stroke-width="3"/>
    <path d="M 62 60 C 78 45, 96 32, 110 26 C 98 40, 80 68, 70 80" stroke-width="2.6"/>
    <path d="M 72 75 C 86 86, 104 102, 122 112 C 128 116, 125 107, 120 100" stroke-width="2.4"/>

    <!-- Flourish to A & name flow -->
    <path d="M 120 100 C 115 82, 130 60, 145 54 C 158 48, 160 62, 152 78 C 142 94, 128 100, 136 103 C 148 107, 164 92, 172 80" stroke-width="2.2"/>
    <path d="M 172 80 C 182 72, 188 74, 192 82 C 196 90, 202 70, 210 68 C 216 66, 215 80, 220 90" stroke-width="2.2"/>
    
    <!-- Descending loop for Argyros 'g' / 'γ' -->
    <path d="M 210 74 C 222 74, 225 84, 224 94 C 220 114, 212 136, 204 138 C 196 139, 198 122, 210 106 C 224 90, 246 72, 265 74" stroke-width="2.4"/>

    <!-- Ending cursive swoosh -->
    <path d="M 265 74 C 278 76, 288 86, 298 84 C 308 83, 320 75, 332 66" stroke-width="2"/>
    <path d="M 240 105 C 280 100, 320 88, 345 78" stroke-width="2.2"/>
  </g>

  <!-- Micro authenticity label -->
  <text x="345" y="126" text-anchor="end" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" letter-spacing="2.5">
    OFFICIAL SIGNATURE
  </text>
</svg>
